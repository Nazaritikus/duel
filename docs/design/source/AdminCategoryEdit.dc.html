<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Duel адмінка — редагування категорії</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#F5A524}a:hover{color:#FFC861}
input::placeholder{color:#8B93A1}
.ph{background-color:#1A1F2B;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0.04) 0 8px,transparent 8px 16px)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #0B0D12; color: #F3F4F6; display: flex; font-family: Inter, system-ui, sans-serif">
  <nav style="width: 240px; box-sizing: border-box; border-right: 1px solid #1A1F2B; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; padding: 0 12px 24px">DUEL <span style="font-family: Inter, sans-serif; font-weight: 500; font-size: 13px; color: #9CA3AF">admin</span></div>
    <a href="AdminCategories.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: #151922; color: #F3F4F6; text-decoration: none; font-weight: 600">Категорії</a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; color: #9CA3AF; text-decoration: none; font-weight: 500">Налаштування</a>
  </nav>

  <main style="flex: 1; min-width: 0; padding: 28px 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <a href="AdminCategories.dc.html" style="font-size: 14px; color: #9CA3AF; text-decoration: none">← Категорії</a>
        <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 26px">Автомобілі</h1>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <span style="font-size: 14px; color: #9CA3AF">72 фото · 1 без відповіді · 1 вертикальне</span>
        <button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #2A3040; background: #151922; color: #F3F4F6; font-weight: 600; font-size: 15px; font-family: Inter, sans-serif">Зберегти чернетку</button>
        <button style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #F5A524; color: #0B0D12; font-weight: 700; font-size: 15px; font-family: Inter, sans-serif">Опублікувати</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="name" style="font-size: 13px; font-weight: 600; color: #9CA3AF">Назва категорії</label>
        <input id="name" value="Автомобілі" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2A3040; background: #151922; color: #F3F4F6; font-size: 16px; padding: 0 14px; font-family: Inter, sans-serif">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="desc" style="font-size: 13px; font-weight: 600; color: #9CA3AF">Підказка для гравців</label>
        <input id="desc" value="Назвіть марку і модель" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2A3040; background: #151922; color: #F3F4F6; font-size: 16px; padding: 0 14px; font-family: Inter, sans-serif">
      </div>
      <div style="border: 2px dashed #2A3040; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 14px; color: #9CA3AF; padding: 10px 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600; color: #F3F4F6">Перетягніть фото або <a href="#">оберіть файли</a></span>
          <span style="font-size: 13px">Назва файлу стає відповіддю: «fiat-500.jpg» → «Fiat 500». Фото відповіді: «fiat-500.answer.jpg»</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="10">
        <div style="background: #151922; border: 1px solid {{it.border}}; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
          <div style="height: 120px; display: grid; grid-template-columns: 3fr 2fr; gap: 2px; background: #0B0D12">
            <div class="ph" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8B93A1; font-size: 12px; font-weight: 600">
              <span>[ФОТО]</span><span style="font-size: 11px; color: #9CA3AF">питання</span>
              <sc-if value="{{it.vertical}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; bottom: 6px; left: 6px; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: #3A2E12; color: #F5C46A">вертикальне</span></sc-if>
              <button aria-label="Видалити фото" style="position: absolute; top: 6px; left: 6px; width: 28px; height: 28px; border-radius: 8px; border: 0; background: rgba(11,13,18,0.8); color: #F3F4F6; display: flex; align-items: center; justify-content: center">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
              </button>
            </div>
            <sc-if value="{{it.hasAnswerImg}}" hint-placeholder-val="{{ true }}">
              <div class="ph" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8B93A1; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 2px #30A46C">
                <span>[ФОТО]</span><span style="font-size: 11px; color: #4ADE80">відповідь</span>
              </div>
            </sc-if>
            <sc-if value="{{it.noAnswerImg}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Додати фото відповіді" style="border: 0; background: #151922; color: #9CA3AF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; font-family: Inter, sans-serif; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                <span>фото відповіді</span>
              </button>
            </sc-if>
          </div>
          <div style="padding: 10px; display: flex; flex-direction: column; gap: 6px">
            <input aria-label="Правильна відповідь" value="{{it.answer}}" placeholder="Правильна відповідь" style="height: 36px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{it.border}}; background: #0B0D12; color: #F3F4F6; font-size: 14px; font-weight: 600; padding: 0 10px; font-family: Inter, sans-serif">
            <span style="font-size: 12px; color: {{it.hintColor}}">{{it.hint}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [['[ВІДПОВІДЬ 1]',2],['[ВІДПОВІДЬ 2]',0],['[ВІДПОВІДЬ 3]',1],['',0],['[ВІДПОВІДЬ 5]',3],['[ВІДПОВІДЬ 6]',0],['[ВІДПОВІДЬ 7]',1],['[ВІДПОВІДЬ 8]',0],['[ВІДПОВІДЬ 9]',2],['[ВІДПОВІДЬ 10]',0]];
    return { items: list.map(x => ({
      answer: x[0], vertical: x[0] === '[ВІДПОВІДЬ 6]', hasAnswerImg: x[1] > 1, noAnswerImg: !(x[1] > 1),
      border: x[0] ? '#2A3040' : '#E5484D',
      hint: x[0] ? (x[1] > 1 ? 'Окреме фото відповіді' : 'Відповідь на тому ж фото') : 'Немає відповіді',
      hintColor: x[0] ? '#9CA3AF' : '#FF8B8E'
    })) };
  }
}
</script>
</body>
</html>
